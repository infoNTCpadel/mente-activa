services:
  mente-activa:
    build: .
    container_name: mente-activa
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATA_DIR: /data
      PANEL_CODE: cambia-esto
    volumes:
      - ./data:/data
    # En el VPS (Traefik): descomentar y ajustar el dominio
